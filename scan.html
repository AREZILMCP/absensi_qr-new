<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scan QR — Absensi &amp; Kupon Makan</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <link rel="stylesheet" href="css/style.css?v=scanpage1" />
</head>
<body class="scan-page">

  <div class="scan-page-wrap">
    <header class="scan-page-top">
      <div class="scan-page-clock">
        <div class="scan-clock-time" id="scanClockTime">--:--:--</div>
        <div class="scan-clock-date" id="scanClockDate">&mdash;</div>
      </div>
      <div class="scan-page-mode" id="scanModeLabel">PRESENSI</div>
      <a class="scan-page-exit" href="index.html" title="Kembali ke Dashboard">&larr; Dashboard</a>
    </header>

    <main class="scan-page-cam">
      <div id="reader"></div>
      <div class="scan-page-hint" id="scanCamHint">Arahkan QR karyawan ke kamera</div>
    </main>

    <footer class="scan-page-last" id="scanLast">Terakhir: &mdash;</footer>
  </div>

  <!-- Overlay gate: warna memenuhi LAYAR (hijau/merah/kuning), 1 detik. -->
  <div class="result scan-overlay" id="resultScan" role="status" aria-live="polite"></div>

  <script src="js/utils.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/karyawan.js"></script>
  <script src="js/scanner.js"></script>
  <script src="js/kiosk.js"></script>
  <script src="js/scan-page.js"></script>
</body>
</html>
